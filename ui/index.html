<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Network Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 40px; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; max-width: 600px; margin: 0 auto 20px auto; border: 1px solid #334155; }
        h2 { margin-top: 0; color: #38bdf8; }
        .status-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .Online { background-color: #059669; color: #ecfdf5; }
        .Offline { background-color: #dc2626; color: #fef2f2; }
        .metric { font-size: 32px; font-weight: bold; color: #f1f5f9; margin-top: 10px; }
        button { background-color: #0284c7; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
        pre { background: #020617; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 13px; color: #a7f3d0; max-height: 200px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Network Nodes & Stats</h2>
        <div class="status-container">
            <span>Device Connection Status:</span>
            <span id="node-status" class="status-badge Offline">Offline</span>
        </div>
        <div>Total Metered Bandwidth:</div>
        <div id="bandwidth-metric" class="metric">0 Bytes</div>
    </div>

    <div class="card">
        <h2>Tunnel Terminal</h2>
        <p>Trigger a request through your remote connected client app:</p>
        <button onclick="runTunnelTest()">Fetch Allowlisted Target Data</button>
        <h3>Response Logs:</h3>
        <pre id="terminal-output">Awaiting connection execution...</pre>
    </div>

    <script>
        const host = window.location.origin;

        async function updateDashboardMetrics() {
            try {
                const res = await fetch(`${host}/api/stats`);
                const data = await res.json();
                
                const statusEl = document.getElementById("node-status");
                statusEl.textContent = data.status;
                statusEl.className = `status-badge ${data.status}`;
                
                document.getElementById("bandwidth-metric").textContent = data.bytes_used + " Bytes";
            } catch (err) {
                console.error("Dashboard reporting error:", err);
            }
        }

        async function runTunnelTest() {
            const out = document.getElementById("terminal-output");
            out.textContent = "Routing transaction through active client device...";
            try {
                const res = await fetch(`${host}/proxy?url=https://httpbin.org`);
                const text = await res.text();
                out.textContent = text;
                updateDashboardMetrics();
            } catch (err) {
                out.textContent = "Error: Failed to fetch through active tunnel client.";
            }
        }

        setInterval(updateDashboardMetrics, 3000);
        updateDashboardMetrics();
    </script>
</body>
</html>
